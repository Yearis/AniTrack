  <!-- Rising Sun Accent -->
  <circle cx="32" cy="36" r="10" fill="#6366f1" opacity="0.9"/>
  
  <!-- Torii Gate Pillars -->
  <line x1="21" y1="24" x2="19" y2="52" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="43" y1="24" x2="45" y2="52" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Bottom Crossbar (Nuki) -->
  <line x1="13" y1="25" x2="51" y2="25" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Center Strut (Gakuzuka) -->
